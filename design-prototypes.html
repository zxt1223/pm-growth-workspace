<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Design Prototypes — Light SaaS Admin Dashboard (4 scenes)</title>
<style>
  /* ===== Design Tokens (from the prompt) ===== */
  :root{
    --bg-grad-1:#EEF1FF; --bg-grad-2:#F5F7FF; --bg-grad-3:#FAFAFE;
    --panel:#FFFFFF;
    --shadow-panel:0 20px 60px -20px rgba(95,108,255,.18), 0 8px 24px -8px rgba(95,108,255,.10);
    --shadow-card:0 4px 16px rgba(95,108,255,.06);
    --shadow-card-hover:0 8px 24px rgba(95,108,255,.12);
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --r-pill:999px;
    --brand:#4F6BFF; --brand-hover:#3D57E6; --brand-soft:#E8EDFF; --brand-soft-2:#EEF1FF;
    --t1:#1A2233; --t2:#6B7280; --t3:#9CA3AF;
    --line:#EEF0F5; --grid:#F1F3F9;
    --success:#16A34A; --success-bg:#E7F8EF;
    --danger:#DC2626; --danger-bg:#FEE7E7;
    --warn:#F59E0B; --warn-bg:#FFF6E0;
    --info:#2563EB; --info-bg:#E8F0FE;
    --c1:#4F6BFF; --c2:#8C9EFF; --c3:#B8C2FF; --c4:#16A34A; --c5:#F59E0B; --c6:#DC2626; --c7:#9CA3AF;
    --font:"Inter","PingFang SC",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font);
    background:linear-gradient(135deg,var(--bg-grad-1),var(--bg-grad-2) 45%,var(--bg-grad-3));
    color:var(--t1);
    -webkit-font-smoothing:antialiased;
    padding:28px;
    min-height:100vh;
  }
  /* ===== Scene tabs ===== */
  .scene-tabs{
    display:flex; gap:8px; justify-content:center; margin-bottom:18px; flex-wrap:wrap;
  }
  .scene-tab{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r-pill);
    padding:9px 18px; font-size:13px; font-weight:600; color:var(--t2); cursor:pointer;
    box-shadow:var(--shadow-card); transition:all .18s ease-out;
  }
  .scene-tab:hover{color:var(--t1);}
  .scene-tab.active{background:var(--brand); color:#fff; border-color:var(--brand);}
  /* ===== Browser shell ===== */
  .browser{
    max-width:1320px; margin:0 auto; background:var(--panel); border-radius:var(--r-xl);
    box-shadow:var(--shadow-panel); overflow:hidden;
  }
  .browser-bar{
    height:40px; background:#FBFBFD; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:14px; padding:0 16px;
  }
  .dots{display:flex; gap:7px;}
  .dots i{width:11px;height:11px;border-radius:50%;display:block;}
  .dots .r{background:#FF5F57;} .dots .y{background:#FEBC2E;} .dots .g{background:#28C840;}
  .nav-btns{display:flex; gap:10px; color:var(--t3); font-size:15px;}
  .url{
    flex:1; background:#F1F3F9; border-radius:var(--r-pill); height:24px;
    display:flex; align-items:center; padding:0 14px; font-size:12px; color:var(--t2); gap:8px;
  }
  .url .padlock{color:var(--success);}
  .bar-actions{display:flex; gap:12px; color:var(--t3); font-size:14px;}
  /* ===== App layout ===== */
  .app{display:flex; min-height:760px;}
  /* Sidebar */
  .sidebar{
    width:240px; background:var(--panel); border-right:1px solid var(--line);
    padding:20px 14px; display:flex; flex-direction:column; flex-shrink:0;
  }
  .logo{display:flex; align-items:center; gap:11px; padding:6px 8px 18px;}
  .logo .mark{
    width:34px;height:34px;border-radius:10px; background:var(--brand);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;
    box-shadow:0 6px 14px -4px rgba(79,107,255,.5);
  }
  .logo .name{font-weight:700;font-size:17px;color:var(--t1);}
  .user-card{
    display:flex;align-items:center;gap:11px;padding:11px;border-radius:var(--r-md);
    margin-bottom:14px; transition:background .18s;
  }
  .user-card:hover{background:var(--brand-soft-2);}
  .user-card img, .user-card .av{
    width:42px;height:42px;border-radius:50%;object-fit:cover;
    background:linear-gradient(135deg,#8C9EFF,#4F6BFF); flex-shrink:0;
  }
  .user-card .nm{font-weight:700;font-size:14px;line-height:1.2;}
  .user-card .rl{font-size:12px;color:var(--t2);}
  .menu{display:flex;flex-direction:column;gap:3px;}
  .menu-group{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;
    letter-spacing:.05em; padding:14px 12px 6px;}
  .mi{
    display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r-md);
    font-size:14px;font-weight:500;color:var(--t1);cursor:pointer;transition:all .15s;
  }
  .mi svg{width:19px;height:19px;stroke:var(--t2);fill:none;stroke-width:1.75;flex-shrink:0;}
  .mi:hover{background:var(--brand-soft-2);}
  .mi.active{background:var(--brand-soft-2); color:var(--brand); font-weight:600;}
  .mi.active svg{stroke:var(--brand);}
  .menu-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);}
  /* Main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    height:68px;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:18px;padding:0 26px;flex-shrink:0;
  }
  .topbar .tt{font-size:22px;font-weight:700;}
  .topbar .ts{font-size:13px;color:var(--t2);margin-top:2px;}
  .topbar .spacer{flex:1;}
  .search{
    width:300px;height:40px;background:#F4F6FF;border:1px solid var(--line);border-radius:var(--r-md);
    display:flex;align-items:center;gap:9px;padding:0 13px;color:var(--t3);font-size:13px;
  }
  .search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,107,255,.12);}
  .icon-btn{
    width:40px;height:40px;border-radius:var(--r-md);background:#F4F6FF;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--t2);position:relative;transition:background .15s;
  }
  .icon-btn:hover{background:var(--brand-soft);}
  .icon-btn .dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:2px solid #F4F6FF;}
  .avatar-sm{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#8C9EFF,#4F6BFF);}
  .sel{
    height:40px;border-radius:var(--r-md);border:1px solid var(--line);background:#fff;
    padding:0 14px;font-size:13px;font-weight:600;color:var(--t1);display:flex;align-items:center;gap:8px;cursor:pointer;
  }
  .btn-primary{
    height:40px;border-radius:var(--r-md);background:var(--brand);color:#fff;border:none;cursor:pointer;
    padding:0 18px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 16px -6px rgba(79,107,255,.6);
  }
  .btn-primary:hover{background:var(--brand-hover);}
  /* Content */
  .content{padding:24px 26px 30px;overflow:auto;}
  .grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:20px;}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow-card);transition:box-shadow .2s ease-out;
  }
  .card:hover{box-shadow:var(--shadow-card-hover);}
  .kpi{padding:18px 20px;position:relative;}
  .kpi .kh{display:flex;justify-content:space-between;align-items:flex-start;}
  .kpi .kt{font-size:13px;color:var(--t2);font-weight:500;}
  .kpi .more{width:24px;height:24px;border-radius:6px;color:var(--t3);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .kpi .kv{font-size:30px;font-weight:700;margin-top:10px;font-variant-numeric:tabular-nums;letter-spacing:-.5px;}
  .kpi .ktrend{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;}
  .chip{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-size:12px;padding:2px 8px;border-radius:var(--r-pill);}
  .chip.up{color:var(--success);background:var(--success-bg);}
  .chip.down{color:var(--danger);background:var(--danger-bg);}
  .kpi .ksub{color:var(--t3);font-weight:400;font-size:13px;}
  .kpi .spark{position:absolute;right:16px;top:18px;}
  /* chart row */
  .row{display:grid;gap:18px;margin-bottom:20px;}
  .row.c-2{grid-template-columns:1.6fr 1fr;}
  .row.c-3{grid-template-columns:1.4fr 1fr 1fr;}
  .chart-card{padding:20px 22px;}
  .chart-card .ch-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .chart-card .ch-title{font-size:15px;font-weight:700;}
  .chart-card .ch-sub{font-size:12px;color:var(--t2);}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--t2);}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle;}
  /* donut center */
  .donut-wrap{display:flex;align-items:center;gap:18px;}
  .donut-center{position:relative;}
  .donut-center .dc-val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .donut-center .dc-val b{font-size:22px;}
  .donut-center .dc-val span{font-size:11px;color:var(--t2);}
  .donut-side{display:flex;flex-direction:column;gap:9px;font-size:13px;}
  .donut-side .ds{display:flex;align-items:center;gap:8px;color:var(--t2);}
  .donut-side .ds b{color:var(--t1);}
  /* status ring */
  .status-ring{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .ring-center{position:relative;}
  .ring-center .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-center .rc b{font-size:26px;}
  .ring-center .rc span{font-size:11px;color:var(--t2);}
  .status-mini{display:flex;gap:24px;}
  .status-mini .sm b{font-size:18px;}
  .status-mini .sm span{font-size:12px;color:var(--t2);display:block;}
  /* table card */
  .table-card{padding:18px 20px 8px;}
  .table-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .table-head .th-title{font-size:16px;font-weight:700;}
  .table-head .spacer{flex:1;}
  .tb-btn{height:36px;border-radius:10px;background:var(--brand-soft);border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;width:36px;color:var(--t2);transition:background .15s;}
  .tb-btn:hover{background:var(--brand-soft-2);}
  .tb-add{height:36px;border-radius:10px;background:var(--brand);color:#fff;border:none;cursor:pointer;
    padding:0 15px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;}
  .sel-2{height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;color:var(--t1);cursor:pointer;}
  table{width:100%;border-collapse:collapse;}
  thead th{
    text-align:left;font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;
    padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  thead th.num{text-align:right;}
  tbody td{padding:13px 14px;border-bottom:1px solid var(--grid);font-size:14px;color:var(--t1);vertical-align:middle;}
  tbody tr{transition:background .15s;}
  tbody tr:hover{background:#F8FAFF;}
  tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--brand);}
  .cell-user{display:flex;align-items:center;gap:11px;}
  .cell-user .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#8C9EFF,#4F6BFF);flex-shrink:0;}
  .cell-user .nm{font-weight:600;font-size:14px;line-height:1.2;}
  .cell-user .em{font-size:12px;color:var(--t2);}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 11px;border-radius:var(--r-pill);white-space:nowrap;}
  .pill.green{color:var(--success);background:var(--success-bg);}
  .pill.blue{color:var(--info);background:var(--info-bg);}
  .pill.yellow{color:var(--warn);background:var(--warn-bg);}
  .pill.red{color:var(--danger);background:var(--danger-bg);}
  .pill i{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
  .progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);}
  .progress .bar{width:80px;height:6px;border-radius:var(--r-pill);background:var(--grid);overflow:hidden;}
  .progress .bar i{display:block;height:100%;border-radius:var(--r-pill);background:var(--brand);}
  .days{display:flex;gap:5px;}
  .days .d{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;background:var(--grid);color:var(--t3);}
  .days .d.on{background:var(--brand);color:#fff;}
  .svc{display:flex;gap:6px;flex-wrap:wrap;}
  .svc .s{font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--r-pill);background:var(--brand-soft);color:var(--brand);}
  /* selection banner */
  .sel-banner{display:flex;align-items:center;gap:10px;background:var(--brand-soft-2);border:1px solid var(--brand-soft);
    border-radius:var(--r-md);padding:10px 14px;margin-bottom:14px;font-size:13px;font-weight:600;color:var(--brand);}
  .sel-banner .acts{display:flex;gap:6px;margin-left:auto;}
  .sel-banner .acts .a{width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--t2);cursor:pointer;}
  .sel-banner .acts .check{background:var(--brand);color:#fff;border:none;}
  .sel-banner .acts .del{color:var(--danger);}
  /* footer pagination */
  .table-foot{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 16px;font-size:13px;color:var(--t2);}
  .pager{display:flex;gap:6px;align-items:center;}
  .pager button{height:32px;min-width:32px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--t2);font-size:13px;padding:0 9px;}
  .pager button.active{background:var(--brand);color:#fff;border-color:var(--brand);}
  /* recent activity */
  .activity{padding:6px 4px;}
  .act-item{display:flex;gap:13px;padding:11px 4px;border-bottom:1px solid var(--grid);}
  .act-item:last-child{border-bottom:none;}
  .act-item .ic{width:34px;height:34px;border-radius:10px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;color:var(--brand);flex-shrink:0;}
  .act-item .txt{font-size:13px;line-height:1.5;}
  .act-item .txt b{font-weight:600;}
  .act-item .txt .tm{color:var(--t3);font-size:12px;}
  .view-report{color:var(--brand);font-size:13px;font-weight:600;cursor:pointer;}
  .hint{text-align:center;color:var(--t3);font-size:12px;margin-top:18px;}
</style>
</head>
<body>
  <div class="scene-tabs" id="sceneTabs"></div>
  <div class="browser">
    <div class="browser-bar">
      <div class="dots"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <div class="nav-btns"><span>‹</span><span>›</span></div>
      <div class="url"><span class="padlock">🔒</span><span id="urlText">app.nexus.com/dashboard</span></div>
      <div class="bar-actions"><span>⟳</span><span>⤢</span><span>＋</span><span>☰</span></div>
    </div>
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main">
        <header class="topbar" id="topbar"></header>
        <div class="content" id="content"></div>
      </main>
    </div>
  </div>
  <div class="hint">基于你提供的 4 张参考图提炼的设计 Token 复刻 · 顶部切换 4 个场景 · 纯 HTML/CSS/SVG，无图表库</div>

<script>
/* ===================== SVG helpers ===================== */
function sparkline(points, w=84, h=30){
  const max=Math.max(...points), min=Math.min(...points);
  const rng=(max-min)||1;
  const step=w/(points.length-1);
  const pts=points.map((p,i)=>[i*step, h-((p-min)/rng)*(h-6)-3]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L ${w} ${h} L 0 ${h} Z`;
  const id='g'+Math.random().toString(36).slice(2,7);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4F6BFF" stop-opacity=".28"/><stop offset="100%" stop-color="#4F6BFF" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="#4F6BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3" fill="#4F6BFF"/>
  </svg>`;
}
function barChart(data, opts={}){
  const w=520,h=200,pad=24, gap=14;
  const max=Math.max(...data.map(d=>Math.max(d.a,d.b)))*1.12;
  const bw=(w-pad*2-gap*(data.length-1))/data.length/2;
  const groupW=bw*2+gap;
  const y=v=>h-pad-(v/max)*(h-pad*2);
  let bars='';
  data.forEach((d,i)=>{
    const x=pad+i*groupW;
    bars+=`<rect x="${x.toFixed(1)}" y="${y(d.a).toFixed(1)}" width="${bw.toFixed(1)}" height="${(h-pad-y(d.a)).toFixed(1)}" rx="5" fill="#B8C2FF"/>`;
    bars+=`<rect x="${(x+bw).toFixed(1)}" y="${y(d.b).toFixed(1)}" width="${bw.toFixed(1)}" height="${(h-pad-y(d.b)).toFixed(1)}" rx="5" fill="#4F6BFF"/>`;
    bars+=`<text x="${(x+groupW/2).toFixed(1)}" y="${h-6}" font-size="11" fill="#9CA3AF" text-anchor="middle">${d.m}</text>`;
  });
  // gridlines
  let grid='';
  for(let i=0;i<=3;i++){const gy=pad+i*((h-2*pad)/3);grid+=`<line x1="${pad}" y1="${gy}" x2="${w-pad}" y2="${gy}" stroke="#F1F3F9"/>`;}
  return `<svg width="100%" viewBox="0 0 ${w} ${h}">${grid}${bars}</svg>`;
}
function donut(segments){
  const size=140, r=54, c=size/2, cx=2*Math.PI*r;
  let off=0, arcs='';
  segments.forEach(s=>{
    const len=s.p/100*cx;
    arcs+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${s.c}" stroke-width="16"
      stroke-dasharray="${len.toFixed(1)} ${(cx-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"
      transform="rotate(-90 ${c} ${c})" stroke-linecap="butt"/>`;
    off+=len;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}</svg>`;
}
function statusRing(pct){
  const size=150, r=58, c=size/2, cx=2*Math.PI*r, len=pct/100*cx;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#F1F3F9" stroke-width="14"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#4F6BFF" stroke-width="14"
      stroke-dasharray="${len.toFixed(1)} ${(cx-len).toFixed(1)}" stroke-linecap="round"
      transform="rotate(-90 ${c} ${c})"/>
  </svg>`;
}
function icon(name){
  const p={
    grid:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>',
    chart:'<path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 4-6"/>',
    box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
    users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13A4 4 0 0 1 16 11"/>',
    msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',

/* ===================== cell renderers ===================== */
function kpiCard(t,v,trend,dir,sub,pts){
  const arrow = dir==='up'?'↗':'↘';
  return `<div class="card kpi">
    <div class="kh"><div class="kt">${t}</div><div class="more">⋯</div></div>
    ${sparkline(pts)}
    <div class="kv">${v}</div>
    <div class="ktrend"><span class="chip ${dir}">${arrow} ${trend}</span><span class="ksub">${sub}</span></div>
  </div>`;
}
function actItem(ic, txt){
  return `<div class="act-item"><div class="ic">${icon(ic)}</div><div class="txt">${txt}</div></div>`;
}
function attRow(nm,em,time,pc,label,typ,amt){
  return `<tr>
    <td><input type="checkbox"></td>
    <td><div class="cell-user"><div class="av"></div><div><div class="nm">${nm}</div><div class="em">${em}</div></div></div></td>
    <td>${time}</td>
    <td><span class="pill ${pc}"><i></i>${label}</span></td>
    <td>${typ}</td>
    <td class="num">${amt}</td>
  </tr>`;
}
function locRow(nm,em,reg,pc,label,prog,amt){
  return `<tr>
    <td><input type="checkbox"></td>
    <td><div class="cell-user"><div class="av"></div><div><div class="nm">${nm}</div><div class="em">${em}</div></div></div></td>
    <td>${reg}</td>
    <td><span class="pill ${pc}"><i></i>${label}</span></td>
    <td><div class="progress"><div class="bar"><i style="width:${prog}%"></i></div>${prog}%</div></td>
    <td class="num">${amt}</td>
  </tr>`;
}
function staffRow(nm,em,role,days,svcs,pc,label){
  const dn=['S','M','T','W','T','F','S'];
  const dayEls=dn.map((d,i)=>`<div class="d ${days[i]==='1'?'on':''}">${d}</div>`).join('');
  const svcEls=svcs.map(s=>`<span class="s">${s}</span>`).join('');
  return `<tr>
    <td><input type="checkbox"></td>
    <td><div class="cell-user"><div class="av"></div><div><div class="nm">${nm}</div><div class="em">${em}</div></div></div></td>
    <td>${role}</td>
    <td><div class="days">${dayEls}</div></td>
    <td><div class="svc">${svcEls}</div></td>
    <td><span class="pill ${pc}"><i></i>${label}</span></td>
  </tr>`;
}

/* ===================== render engine ===================== */
function renderScene(key){
  const s=SCENES[key];
  document.getElementById('urlText').textContent=s.url;
  // sidebar
  let sb=`<div class="logo"><div class="mark">${s.mark}</div><div class="name">${s.brand}</div></div>
    <div class="user-card"><div class="av"></div><div><div class="nm">${s.user.name}</div><div class="rl">${s.user.role}</div></div></div>
    <div class="menu">`;
  s.menu.forEach(g=>{
    sb+=`<div class="menu-group">${g.group}</div>`;
    g.items.forEach(it=>{
      sb+=`<div class="mi ${it.active?'active':''}">${icon(it.icon)}<span>${it.label}</span></div>`;
    });
  });
  sb+=`</div><div class="menu-foot"><div class="mi">${icon('logout')}<span>Log out</span></div></div>`;
  document.getElementById('sidebar').innerHTML=sb;
  // topbar
  const t=s.topbar;
  document.getElementById('topbar').innerHTML=`
    <div><div class="tt">${t.title}</div><div class="ts">${t.sub}</div></div>
    <div class="spacer"></div>
    ${t.showSearch?`<div class="search">⌕ Search here…</div>`:''}
    <button class="icon-btn">◐</button>
    <button class="icon-btn">✉</button>
    <button class="icon-btn">🔔<span class="dot"></span></button>
    <div class="avatar-sm"></div>
    <button class="sel">${t.sel}</button>
    <button class="btn-primary">⤓ ${t.btn}</button>`;
  // content
  document.getElementById('content').innerHTML=s.render();
}
/* tabs */
const tabsOrder=['dashboard','events','locations','staff'];
const tabsLabel={dashboard:'① Dashboard · Nexus',events:'② Events · CrowdPass',locations:'③ Locations · Konoom',staff:'④ Staff · Zendenta'};
const tabsEl=document.getElementById('sceneTabs');
tabsOrder.forEach(k=>{
  const b=document.createElement('div');
  b.className='scene-tab'+(k==='dashboard'?' active':'');
  b.textContent=tabsLabel[k];
  b.onclick=()=>{
    document.querySelectorAll('.scene-tab').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    renderScene(k);
    try{ history.replaceState(null,'','#'+k); }catch(e){ location.hash=k; }
  };
  tabsEl.appendChild(b);
});
function sceneFromHash(){
  const h=(location.hash||'').replace('#','');
  return SCENES[h]?h:'dashboard';
}
function goScene(k){
  if(!SCENES[k]) k='dashboard';
  document.querySelectorAll('.scene-tab').forEach(x=>x.classList.toggle('active', x.dataset.key===k));
  renderScene(k);
}
renderScene(sceneFromHash());
// 监听 hash 变化 + 父页 postMessage（用于工作台面板内嵌秒切，不重新加载）
window.addEventListener('hashchange',()=>goScene(sceneFromHash()));
window.addEventListener('message',(e)=>{
  const d=e.data;
  if(!d) return;
  if(d.type==='design-scene' && typeof d.key==='string'){
    goScene(d.key);
    try{ history.replaceState(null,'','#'+d.key); }catch(_){ location.hash=d.key; }
  }
});
</script>
